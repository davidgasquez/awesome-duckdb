  '^https://lib\.rs',
  '^https://enrich\.sh',
  '^https://streams\.dbconvert\.com',
  '^https://communities\.sas\.com',
  '^https://www\.packtpub\.com',
  '^https://www\.transfermarkt\.co\.uk',
]
